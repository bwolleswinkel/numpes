name: tests

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
    workflow_call: {}

jobs:
    tests: 
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                cdd_gmp: [true, false]
                python: ['3.10', '3.14']
                extra: [base, cdd, extra, full]

                exclude:
                    - python: '3.10'
                    - extra: cdd
                    - extra: extra
                    - os: ubuntu-latest
                      cdd_gmp: true
                      extra: base
                    - os: ubuntu-latest
                      cdd_gmp: false
                      extra: full
                    - os: macos-latest
                      cdd_gmp: true
                      extra: base
                    - os: macos-latest
                      cdd_gmp: false
                      extra: full
                    - os: windows-latest
                      cdd_gmp: true
                      extra: base
                    - os: windows-latest
                      cdd_gmp: false
                      extra: full

        runs-on: ${{ matrix.os }}

        if: "!contains(github.event.head_commit.message, '[skip tests]')"

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: ${{ matrix.python }}

            - name: Install system dependencies
              if: matrix.cdd_gmp && matrix.os != 'windows-latest'
              shell: bash
              run: |
                if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
                    sudo apt-get update
                    sudo apt-get install -y libcdd-dev libgmp-dev
                elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
                    brew install cddlib gmp
                fi

            - name: Cache vcpkg
              if: matrix.os == 'windows-latest'
              uses: actions/cache@v4
              with:
                path: vcpkg
                key: vcpkg-${{ runner.os }}-windows
                restore-keys: |
                  vcpkg-${{ runner.os }}-

            - name: Install system dependencies on Windows
              if: matrix.cdd_gmp && matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
                .\vcpkg\bootstrap-vcpkg.bat
                .\vcpkg\vcpkg.exe install gmp:x64-windows cddlib:x64-windows

            - name: Install dependencies
              shell: bash
              run: |
                python -m pip install --upgrade pip
                python -m pip install tox tox-gh-actions

            - name: Tests with tox
              if: matrix.os != 'windows-latest'
              shell: bash
              run: |
                if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
                  export CFLAGS="-I/opt/homebrew/include"
                  export LDFLAGS="-L/opt/homebrew/lib"
                  export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:${PKG_CONFIG_PATH}"
                fi
                tox -e ${{ matrix.extra }}

            - name: Tests with tox on Windows
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                .\vcpkg\vcpkg.exe env "tox -e ${{ matrix.extra }}" --triplet x64-windows