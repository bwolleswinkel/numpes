name: tests

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
    workflow_call: {}

jobs:
    test:   
        runs-on: ubuntu-latest
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.14'

            - name: Install system dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y libcdd-dev libgmp-dev

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                python -m pip install tox tox-gh-actions

            - name: Debug checkout
              run: |
                git rev-parse HEAD
                git status --short
                git log -1 --oneline
                git diff --stat HEAD^..HEAD
                git grep -n "test_enum_verts_nondegen_2d" -- tests/numpes/utils/test_spatial.py || true

            - name: Tests with tox
              run: python -m tox -e py314 -- -vv