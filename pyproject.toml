[project]
name = "numpes"
dynamic = ["version"]
dependencies = [
  "numpy",
  "scipy",
]
requires-python = ">=3.14"
authors = [
  {name = "Bart Wolleswinkel", email = "b.wolleswinkel@tudelft.nl"}
]
description = "Numerical operations on polytopes, ellipsoids, and subspaces"
readme = "README.md"
license = "GPL-3.0"
# TODO: Add more keywords
keywords = ["polytope"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python"
]

[project.optional-dependencies]
cdd = [
  "pycddlib",
]
extra = [
  "matplotlib",
  "cvxpy",
  "pulp",
]
full = [
  "pycddlib",
  "matplotlib",
  "cvxpy",
  "pulp",
]

[dependency-groups]
tests = [
  "numpes[full]",
  "tox",
  "pytest",
  "hypothesis",
]
dev = [
  "numpes[full]",
  "mypy",
  "scipy-stubs",
  "types-matplotlib",
  "isort",
  "pylint",
  "ruff",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.tox]
env_list = [
  "base",
  "cdd",
  "extra",
  "full",
]

[tool.tox.install_command]
install_command = "uv pip install {opts} {packages}"

[tool.tox.env.base]
deps = [
  "pytest",
  "pytest-cov",
  "hypothesis",
]
commands = [
  [
    "pytest",
    "--cov=numpes",
    "--cov-report=term-missing",
    "--cov-report=",
    "--no-cov-on-fail",
    "-rs",
    "tests",
  ]
]

[tool.tox.env.cdd]
extras = ["cdd"]
deps = [
  "pytest",
  "pytest-cov",
  "hypothesis",
]
commands = [
  [
    "pytest",
    "--cov=numpes",
    "--cov-report=term-missing",
    "--cov-report=",
    "--no-cov-on-fail",
    "-rs",
    "tests",
  ]
]

[tool.tox.env.extra]
extras = ["extra"]
deps = [
  "pytest",
  "pytest-cov",
  "hypothesis",
]
commands = [
  [
    "pytest",
    "--cov=numpes",
    "--cov-report=term-missing",
    "--cov-report=",
    "--no-cov-on-fail",
    "-rs",
    "tests",
  ]
]

[tool.tox.env.full]
extras = ["full"]
deps = [
  "pytest",
  "pytest-cov",
  "hypothesis",
]
commands = [
  [
    "pytest",
    "--cov=numpes",
    "--cov-report=term-missing",
    "--cov-report=",
    "--no-cov-on-fail",
    "-rs",
    "tests",
  ]
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib --strict-markers"
testpaths = ["tests"]
markers = [
  # Function-based markers
  "enum_verts: tests for vertex enumeration functionality",
  "enum_facets: tests for facet enumeration functionality", 
  "display: tests for plotting and display functionality",
  # Module-based markers
  "utils: tests for the utils subpackage",
  # Test type-based markers
  "unit: unit tests"
]

[tool.coverage.run]
source = ["numpes"]
branch = true
data_file = "/tmp/.coverage"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
]
skip_covered = false
skip_empty = true
show_missing = true

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
  "too-many-locals",  # R0914
  "too-many-arguments",  # R0913
  "too-many-positional-arguments",  # R0917
  "too-many-instance-attributes",  #R0902
]
